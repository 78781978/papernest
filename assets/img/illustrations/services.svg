<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="svcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#0a0906"/>
    </linearGradient>
  </defs>
  <rect width="500" height="420" fill="url(#svcBg)"/>
  <circle cx="80" cy="60" r="140" fill="#B8935A" opacity=".1"/>

  <!-- maszyna do przewijania: dwie osie + wstęga papieru -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="18" height="130" fill="#453e34"/>
    <rect x="300" y="0" width="18" height="130" fill="#453e34"/>
    <ellipse cx="9" cy="60" rx="26" ry="60" fill="#EDE7D3"/>
    <ellipse cx="9" cy="60" rx="11" ry="26" fill="#B9B296"/>
    <ellipse cx="309" cy="70" rx="18" ry="44" fill="#A9D64B"/>
    <ellipse cx="309" cy="70" rx="8" ry="20" fill="#6F9E0F"/>
    <path d="M35 25 C130 10 210 20 291 40" stroke="#F4F1E4" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="0" y="130" width="318" height="10" fill="#453e34"/>
  </g>

  <!-- dial/control panel accent -->
  <g transform="translate(70,300)">
    <rect width="140" height="60" rx="10" fill="#1c1712" stroke="#453e34" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#DCB877" stroke-width="3"/>
    <circle cx="30" cy="30" r="3" fill="#DCB877"/>
    <rect x="60" y="18" width="60" height="8" rx="4" fill="#453e34"/>
