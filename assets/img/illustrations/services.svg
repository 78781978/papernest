  </g>

  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 8">
    <line x1="420" y1="20" x2="420" y2="400"/>
  </g>
  <circle cx="440" cy="360" r="26" fill="#B8935A" opacity=".18"/>
