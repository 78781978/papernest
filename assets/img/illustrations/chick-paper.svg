<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgChick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b0c"/>
      <stop offset="1" stop-color="#0c0f07"/>
    </linearGradient>
    <linearGradient id="rollChick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8BC113"/>
      <stop offset=".5" stop-color="#A9D64B"/>
      <stop offset="1" stop-color="#6F9E0F"/>
    </linearGradient>
  </defs>
  <rect width="480" height="400" fill="url(#bgChick)"/>
  <ellipse cx="250" cy="335" rx="160" ry="20" fill="#0B2345" opacity=".06"/>

  <!-- unrolled sheet on floor -->
  <path d="M60 300 C160 270 340 270 430 300 L430 320 C340 300 160 300 60 320 Z" fill="#9ED324" opacity=".35"/>

  <!-- roll -->
  <g transform="translate(260,205)">
    <ellipse cx="0" cy="0" rx="44" ry="88" fill="url(#rollChick)" stroke="#4F7309" stroke-width="2"/>
    <rect x="-90" y="-88" width="90" height="176" fill="url(#rollChick)"/>
    <ellipse cx="-90" cy="0" rx="44" ry="88" fill="#B7DE5E" stroke="#4F7309" stroke-width="2"/>
    <ellipse cx="-90" cy="0" rx="19" ry="38" fill="#8BC113"/>
    <ellipse cx="-90" cy="0" rx="8" ry="17" fill="#4F7309"/>
  </g>

  <!-- little chick -->
  <g transform="translate(112,290)">
    <ellipse cx="0" cy="20" rx="26" ry="20" fill="#F7C948"/>
    <circle cx="18" cy="-2" r="15" fill="#F9D766"/>
    <circle cx="23" cy="-6" r="2.4" fill="#0B2345"/>
    <path d="M32 -4 L42 -1 L32 3 Z" fill="#E8871E"/>
    <path d="M-22 24 L-30 32 M-4 30 L-8 38" stroke="#E8871E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <circle cx="404" cy="64" r="26" fill="#8BC113" opacity=".16"/>
</svg>
