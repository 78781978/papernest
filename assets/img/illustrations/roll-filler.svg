<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgFiller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#f0e8d6"/>
    </linearGradient>
    <linearGradient id="rollFiller" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9CFB4"/>
      <stop offset=".5" stop-color="#F0E9D6"/>
      <stop offset="1" stop-color="#CBBF9E"/>
    </linearGradient>
    <linearGradient id="ribbonFiller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCB877"/>
      <stop offset="1" stop-color="#8A6A35"/>
    </linearGradient>
  </defs>
  <rect width="480" height="400" fill="url(#bgFiller)"/>
  <ellipse cx="240" cy="330" rx="150" ry="20" fill="#17140F" opacity=".06"/>

  <!-- crumpled ribbon paper filler -->
  <path d="M120 250c20-40 10-70-15-90 40 10 55 45 45 80 30-25 30-60 5-90 45 15 55 55 30 95 25-10 40-40 30-70 35 20 35 60 5 85" fill="none" stroke="url(#ribbonFiller)" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  <path d="M330 260c-15-35-5-62 18-80-35 5-48 38-40 72-27-20-28-52-8-80-38 10-49 48-30 84" fill="none" stroke="url(#ribbonFiller)" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- roll -->
  <g transform="translate(240,215)">
    <ellipse cx="0" cy="0" rx="46" ry="92" fill="url(#rollFiller)" stroke="#8A927A" stroke-width="2"/>
    <rect x="-95" y="-92" width="95" height="184" fill="url(#rollFiller)"/>
    <ellipse cx="-95" cy="0" rx="46" ry="92" fill="#E9E4D1" stroke="#8A927A" stroke-width="2"/>
    <ellipse cx="-95" cy="0" rx="20" ry="40" fill="#C9C2A5"/>
    <ellipse cx="-95" cy="0" rx="9" ry="18" fill="#8A927A"/>
    <path d="M-95 -92 C-40 -100 -10 -100 0 -92" fill="none" stroke="#8A927A" stroke-width="1.5" opacity=".5"/>
    <path d="M-95 92 C-40 100 -10 100 0 92" fill="none" stroke="#8A927A" stroke-width="1.5" opacity=".5"/>
  </g>

  <circle cx="392" cy="72" r="30" fill="#B8935A" opacity=".16"/>
  <circle cx="60" cy="330" r="18" fill="#17140F" opacity=".07"/>
</svg>
