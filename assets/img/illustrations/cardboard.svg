<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F6F2"/>
      <stop offset="1" stop-color="#E8EAE1"/>
    </linearGradient>
    <linearGradient id="rollCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B8A6C"/>
      <stop offset=".5" stop-color="#C7B695"/>
      <stop offset="1" stop-color="#8B7A5D"/>
    </linearGradient>
  </defs>
  <rect width="480" height="400" fill="url(#bgCard)"/>
  <ellipse cx="245" cy="335" rx="165" ry="20" fill="#0B2345" opacity=".07"/>

  <!-- floor protection strip -->
  <path d="M50 315 C170 290 320 290 435 315 L435 335 C320 312 170 312 50 335 Z" fill="#C7B695" opacity=".45"/>
  <path d="M50 315 C170 290 320 290 435 315" fill="none" stroke="#8B7A5D" stroke-width="2" opacity=".5"/>

  <!-- roll standing -->
  <g transform="translate(250,190)">
    <ellipse cx="0" cy="0" rx="52" ry="104" fill="url(#rollCard)" stroke="#6B5D45" stroke-width="2"/>
    <rect x="-105" y="-104" width="105" height="208" fill="url(#rollCard)"/>
    <ellipse cx="-105" cy="0" rx="52" ry="104" fill="#D8C9A8" stroke="#6B5D45" stroke-width="2"/>
    <ellipse cx="-105" cy="0" rx="24" ry="48" fill="#B4A27F"/>
    <ellipse cx="-105" cy="0" rx="11" ry="22" fill="#6B5D45"/>
    <path d="M-105 -60 L0 -60 M-105 -20 L0 -20 M-105 20 L0 20 M-105 60 L0 60" stroke="#6B5D45" stroke-width="1" opacity=".25"/>
  </g>

  <!-- ladder hint (kontekst remontu) -->
  <g transform="translate(395,150)" opacity=".5" stroke="#0B2345" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="0" x2="-20" y2="150"/>
    <line x1="34" y1="0" x2="14" y2="150"/>
    <line x1="-8" y1="40" x2="26" y2="40"/>
    <line x1="-12" y1="80" x2="22" y2="80"/>
    <line x1="-16" y1="120" x2="18" y2="120"/>
  </g>

  <circle cx="66" cy="70" r="24" fill="#0B2345" opacity=".07"/>
</svg>
